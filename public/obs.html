<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creoveya OBS Output</title>
<link rel="icon" href="/img/logo.svg" type="image/svg+xml">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, Arial, sans-serif; }
  #stage { position: relative; width: 100vw; height: 100vh; background: #000; }
  video { width: 100%; height: 100%; object-fit: cover; display: none; }
  #placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: rgba(255,255,255,.6); }
  #placeholder button {
    background: #2563eb; color: #fff; border: none; padding: 12px 22px; border-radius: 999px;
    font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  /* This overlay control bar is only meant to be visible when the
     broadcaster right-clicks the OBS Browser Source and chooses
     "Interact" — it should not appear in the actual OBS scene output.
     It auto-hides after use is confirmed, and lives in a corner so it
     never blocks the transformed video frame. */
  #controls {
    position: absolute; top: 12px; left: 12px; right: 12px; z-index: 5;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  #controls select, #controls button {
    background: rgba(10,15,31,.75); color: #fff; border: 1px solid rgba(255,255,255,.2);
    border-radius: 8px; padding: 6px 10px; font-size: .82rem;
  }
  #controls button { cursor: pointer; }
  #status { position: absolute; bottom: 12px; left: 12px; z-index: 5; color: rgba(255,255,255,.7); font-size: .78rem; background: rgba(10,15,31,.6); padding: 4px 10px; border-radius: 999px; }
</style>
</head>
<body>
<div id="stage">
  <video id="transformedFeed" autoplay playsinline></video>
  <div id="placeholder">
    <span style="font-size:2rem;">🎬</span>
    <span>Creoveya OBS Output</span>
    <button id="goLiveBtn" type="button">Start Transformed Feed</button>
  </div>
  <div id="controls" class="hidden" style="display:none;">
    <select id="lookSelect"></select>
    <button id="stopBtn" type="button">Stop</button>
  </div>
  <div id="status"></div>
</div>

<script src="/js/common.js"></script>
<script src="/js/obs.js"></script>
</body>
</html>
